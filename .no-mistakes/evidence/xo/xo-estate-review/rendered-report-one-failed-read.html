<h1 class="t">A failed read is named on the figures it fed, and on no others</h1>
<p class="sub">One read denied (HTTP 410 on the open-issue endpoint); every other read went to real GitHub. No headline
figure is issue-derived, so before the fix the headline both hedged a sound claim and asserted that a read behind it had failed.</p>
